<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Настя и Викутория</title>
  <link rel="stylesheet" href="css/style.css?v=fontaine-audio-scale-2">
  <script src="js/game.js?v=fontaine-audio-scale-2" defer></script>
  <script src="js/startup.js?v=map-teleport-1" defer></script>
</head>
<body>
  <div id="orientation-screen" class="technical-screen orientation-screen">
    <p>Поверните устройство горизонтально</p>
  </div>
  <section id="startup-screen" class="technical-screen" aria-label="Подготовка к игре">
    <p id="startup-text" aria-live="polite">Продолжите, когда устройство расположено горизонтально.</p>
    <button id="startup-button" type="button">Продолжить</button>
  </section>
  <section id="loading-screen" class="loading-screen" aria-label="Видео-заставка" hidden>
    <video id="loading-video" playsinline webkit-playsinline preload="auto" disablepictureinpicture
      src="assets/video/genshin-loading.mp4"></video>
    <button id="enter-button" class="technical-button enter-button" type="button" hidden>Войти</button>
  </section>
  <section id="wish-video-overlay" class="wish-video-overlay" aria-label="Анимация молитвы" hidden>
    <video id="wish-video" src="assets/video/wish_animation.mp4" playsinline webkit-playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>
    <div id="wish-video-retry" class="wish-video-retry" hidden>
      <p id="wish-video-error" role="status"></p>
      <button id="wish-retry-button" class="wish-button" type="button">Совершить молитву</button>
    </div>
  </section>
  <audio id="fontaine-music" src="assets/audio/fontaine_theme.mp3" preload="auto" loop></audio>
  <audio id="scene-music" src="assets/audio/beach_intro_theme.mp3" preload="auto" loop></audio>
  <main id="story" class="page" hidden>
    <section id="beach-scene" class="game-window" aria-label="Первая сцена: пляж">
      <div class="background" aria-hidden="true">
        <img id="background" src="assets/images/backgrounds/beach.png" alt="">
      </div>
      <div id="characters" class="characters" aria-label="Персонажи сцены" hidden>
        <div class="character character-left" data-character="Настя">
          <img id="characterLeft" src="assets/images/characters/nastya_idle.png" alt="Настя">
        </div>
        <div class="character character-right" data-character="Викутория">
          <img id="characterRight" src="assets/images/characters/vikutoria_idle.png" alt="Викутория — летающая спутница Насти">
        </div>
      </div>
      <div id="dialogue-box" class="dialogue-box" hidden>
        <div class="dialogue-content" aria-live="polite" aria-atomic="true">
          <h2 id="speaker"></h2>
          <p id="dialogue-text"></p>
        </div>
      </div>
      <button id="next-button" class="next-button" type="button" aria-label="Показать персонажей" disabled>Далее <span aria-hidden="true">◆</span></button>
    </section>
    <section id="travel-map" class="game-window travel-map" aria-label="Карта путешествия" hidden>
      <img id="travel-map-image" class="travel-map-image" src="assets/images/maps/map_fontaine_rizley.png" alt="Карта путешествия">
      <button id="teleport-button" class="teleport-button" type="button" aria-label="Телепортироваться в следующую локацию">
        <img src="assets/images/ui/teleport_icon.png" alt="">
      </button>
    </section>
    <section id="next-scene" class="game-window fontaine-scene" aria-label="Фонтейн" hidden>
      <div id="fontaine-background" class="fontaine-background" aria-hidden="true">
        <img id="fontaine-background-arrival" src="assets/images/backgrounds/fontaine_arrival_bg.png" alt="">
        <img id="fontaine-background-chest" src="assets/images/backgrounds/fontaine_chest_bg.png" alt="" hidden>
        <img id="fontaine-background-neuvillette" src="assets/images/backgrounds/fontaine_neuvillette_bg.png" alt="" hidden>
      </div>
      <div id="fontaine-nastya" class="character fontaine-person fontaine-nastya" data-fontaine-character="Настя" hidden>
        <img id="fontaine-nastya-sprite" src="assets/images/characters/nastya_idle.png" alt="Настя">
      </div>
      <div id="fontaine-vikutoria" class="character fontaine-person fontaine-vikutoria" data-fontaine-character="Викутория" hidden>
        <img id="fontaine-vikutoria-sprite" src="assets/images/characters/vikutoria_idle.png" alt="Викутория">
      </div>
      <div id="fontaine-rizley" class="character fontaine-person fontaine-rizley" data-fontaine-character="Ризли" hidden>
        <img id="fontaine-rizley-sprite" src="assets/images/characters/rizley_idle.png" alt="Ризли">
      </div>
      <div id="fontaine-neuvillette" class="character fontaine-person fontaine-rizley" data-fontaine-character="Нёвиллет" hidden>
        <img id="fontaine-neuvillette-sprite" src="assets/images/characters/neuvillette_idle.png" alt="Нёвиллет">
      </div>
      <button id="fontaine-chest" class="fontaine-chest" type="button" aria-label="Открыть сундук" disabled hidden>
        <img src="assets/images/ui/chest.png" alt="">
      </button>
      <div id="rizley-dialogue" class="dialogue-box" hidden>
        <div class="dialogue-content" aria-live="polite" aria-atomic="true">
          <h2 id="rizley-speaker" class="dialogue-speaker"></h2>
          <p id="rizley-text" class="dialogue-text"></p>
        </div>
      </div>
      <button id="fontaine-next" class="next-button" type="button">Далее ◆</button>
      <div id="wish-action" class="wish-action" hidden>
        <p id="wish-status" class="wish-status" role="status" hidden></p>
        <button id="wish-button" class="wish-button" type="button">Совершить молитву</button>
      </div>
      <div id="fontaine-note-overlay" class="fontaine-note-overlay" hidden>
        <div class="fontaine-note" role="dialog" aria-modal="true" aria-labelledby="fontaine-note-text">
          <img class="note-parchment" src="assets/images/ui/mysterious_note.png" alt="">
          <div class="note-content">
            <p id="fontaine-note-text">Открой сверток с этим символом</p>
            <img id="fontaine-note-icon" src="assets/images/ui/wolf_package_icon.png" alt="Пиктограмма лапы">
            <p class="note-secondary">Нажмите “Продолжить” после вскрытия свертка.</p>
            <button id="fontaine-note-continue" type="button">Продолжить</button>
          </div>
        </div>
      </div>
    </section>
    <noscript>Включите JavaScript, чтобы начать разговор.</noscript>
  </main>
</body>
</html>
