<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Настя и Викутория — визуальная новелла</title>
  <link rel="stylesheet" href="css/style.css?v=beach-scene-2">
  <script src="js/game.js?v=beach-scene-2" defer></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">Визуальная новелла</p>
      <h1>Настя и Викутория</h1>
    </header>
    <section class="game-window" aria-label="Игровое окно">
      <div class="background" aria-hidden="true">
        <img id="background" class="background-image" src="assets/images/backgrounds/beach.png" alt="">
      </div>
      <div class="characters" aria-label="Персонажи сцены">
        <div class="character" data-character="Настя">
          <img id="characterLeft" class="character-sprite" src="assets/images/characters/nastya_01_confused.png" alt="Настя">
          <span>Настя</span>
        </div>
        <div class="character" data-character="Викутория">
          <img id="characterRight" class="character-sprite" src="assets/images/characters/vikutoria_01_indignant.png" alt="Викутория">
          <span>Викутория</span>
        </div>
      </div>
      <div class="dialogue-box">
        <div class="dialogue-content" aria-live="polite" aria-atomic="true">
          <h2 id="speaker">Рассказчик</h2>
          <p id="dialogue-text">Вечер обещал стать особенным. Настя ждала Викуторию у окна.</p>
        </div>
        <button id="next-button" type="button">Далее <span aria-hidden="true">→</span></button>
      </div>
    </section>
    <p class="hint">Нажимайте «Далее», чтобы продолжить историю.</p>
    <noscript>Чтобы переключать диалоги, включите JavaScript в браузере.</noscript>
  </main>
</body>
</html>
